name: CI Process

on:
  push:
    branches: [ "main", "feature-updates" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Zadanie 1: Sprawdzanie budowania obrazu Dockerowego
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Build Docker Image
        run: docker build . -t my-app:test

  # Zadanie 2: Sprawdzanie poprawności kodu (testy Python)
  app-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python test_app.py